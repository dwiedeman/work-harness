name: CI

# DER-2751 (#20): before this workflow existed, NOTHING ran the harness's own test suite on push. An
# unattended multi-host harness with no CI gate is the reviewer's stated reason it "is not yet a
# dependable unattended production harness". Every gate below must be able to FAIL — no `|| true`,
# no `continue-on-error` (that is the DER-2743 defect, in YAML).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = oldest supported LTS; 22 = the version the harness is developed and run on today;
        # 24 = current, so a runtime deprecation surfaces here rather than mid-run on an operator's box.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The harness ships no dependencies and no package.json on purpose: it is stdlib-only node:test,
      # so there is nothing to install and nothing to lock. If that ever changes, this comment is wrong.
      - name: Runner + prep suites
        run: |
          node --test \
            skills/work/work-runner.test.mjs \
            skills/work/work-metrics.test.mjs \
            skills/work/session-end-telemetry.test.mjs \
            skills/work/run-gate.test.mjs \
            skills/prep-for-work/prep-runner.test.mjs \
            hooks/context-wrap-nudge.test.mjs

      # Installer contract (DER-2743): includes the smoke case AND the failure cases — a red suite and a
      # missing `node` must both make install.sh exit nonzero.
      - name: Installer contract
        run: node --test install.test.mjs

      # Repo release-engineering contract (DER-2751): every test file is wired into this workflow, the
      # version is semver, the changelog names it.
      - name: Repo contract
        run: node --test repo-contract.test.mjs

      # Fault-injection E2E (DER-2830). Drives work-runner.mjs as a real SUBPROCESS and INDUCES each
      # failure the harness exists to survive — a torn ledger tail, version skew, a foreign wire version,
      # a phantom reap, an unfinished run. The unit suite proves the predicates; this proves the program.
      #
      # Tier A only here: hermetic, no network, no model calls, no `gh`. The live tier (real leads, real
      # PRs, real cost) is opt-in behind WORK_E2E_LIVE=1 and deliberately never runs in PR CI.
      #
      # This file also carries DEFECT PINS asserting known-live bugs. A pin going RED means the bug was
      # FIXED — invert the pin, do not "repair" the harness to satisfy it.
      - name: Fault-injection E2E (hermetic tier)
        run: node --test e2e.test.mjs

  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Static-check tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck zsh

      - name: node --check every .mjs
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "node --check FAILED: $f"; fail=1; }
          done < <(git ls-files '*.mjs')
          exit $fail
        shell: bash

      # Syntax-check each script with the interpreter its OWN shebang names. `bash -n` on the two
      # `#!/bin/zsh` cmux scripts was checking them against the wrong grammar — it happened to pass, which
      # is worse than failing, because it reported a clean bill of health it had no basis for.
      - name: Syntax-check every .sh with its own interpreter
        run: |
          fail=0
          while IFS= read -r f; do
            if head -1 "$f" | grep -q 'zsh'; then
              zsh -n "$f" || { echo "zsh -n FAILED: $f"; fail=1; }
            else
              bash -n "$f" || { echo "bash -n FAILED: $f"; fail=1; }
            fi
          done < <(git ls-files '*.sh')
          exit $fail
        shell: bash

      # ShellCheck at --severity=error: a real blocking gate, deliberately scoped to errors rather than
      # style. Tightening to `warning` is a follow-up (see CHANGELOG "Known follow-ups") — a gate that
      # is red on arrival for style nits teaches operators to ignore CI, which is worse than no gate.
      #
      # ShellCheck supports sh/bash/dash/ksh ONLY: pointed at a `#!/bin/zsh` script it emits SC1071 as an
      # ERROR and exits nonzero, so the un-scoped version of this gate could never pass. Scope it — and
      # then SAY which files that excluded, because a silent exclusion reads as coverage it isn't.
      - name: ShellCheck (errors, sh/bash/dash/ksh only)
        run: |
          fail=0
          checked=0
          skipped=""
          while IFS= read -r f; do
            if head -1 "$f" | grep -q 'zsh'; then
              skipped="$skipped $f"
              continue
            fi
            shellcheck --severity=error "$f" || fail=1
            checked=$((checked + 1))
          done < <(git ls-files '*.sh')
          if [ -n "$skipped" ]; then
            echo "NOT shellcheck'd — zsh is unsupported (SC1071), syntax-checked with 'zsh -n' instead:$skipped"
          fi
          if [ "$checked" -eq 0 ]; then
            echo "FAIL: shellcheck examined 0 files — a gate that checked nothing is not a gate." >&2
            exit 1
          fi
          echo "shellcheck examined $checked file(s) at --severity=error"
          exit $fail
        shell: bash

  security-regression:
    # DER-2737 (#1) is the one defect class that is live-exploitable on a PUBLIC repo: unauthenticated
    # PR comments were parsed as privileged lifecycle input. Its regressions live in the runner suite;
    # this job runs them BY NAME so a refactor that quietly deletes them fails CI loudly instead of
    # silently reducing the test count.
    name: public-comment security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: DER-2737 comment-ingestion controls
        # `--test-name-pattern` that matches NOTHING exits 0 — so this job would pass loudest at the
        # exact moment the security controls were deleted. Require at least one test to have actually
        # run, or the gate is theatre (DER-2743's lesson, one layer up).
        run: |
          set -o pipefail
          pattern='DER-2737|drive-by|untrusted|allowlist'
          out="$(node --test --test-name-pattern="$pattern" skills/work/work-runner.test.mjs 2>&1 | tee /dev/stderr)"
          # Count PASSING TESTS whose names carry the security keywords — NOT `# pass`, which includes
          # the TAP file-level line (`ok 1 - skills/work/work-runner.test.mjs`) and therefore reports 1
          # even when the pattern matched nothing at all. Verified: pre-fix this said "pass 1" with zero
          # controls present, which is exactly the green-on-nothing gate DER-2743 is about.
          ran="$(printf '%s\n' "$out" | grep -cE "^ *ok [0-9]+ - .*($pattern)" || true)"
          if [ "${ran:-0}" -lt 1 ]; then
            echo "FAIL: no DER-2737 regression test matched /$pattern/ — the public-comment security controls are missing." >&2
            exit 1
          fi
          echo "DER-2737 controls that ran: $ran"
        shell: bash

  version-bump:
    # P0.3 — the release half of harness-drift detection.
    #
    # Measured 2026-07-31: two hosts both reported VERSION 0.2.0 while seven shipped files differed,
    # work-runner.mjs alone by 37,762 bytes. The cause was not a bad install — it was ~12 commits that
    # changed skills/** without ever bumping VERSION. The dispatch-time skew gate compares version
    # STRINGS, so it did not merely miss the drift, it actively reported the two divergent hosts as
    # agreeing. INSTALL-MANIFEST.json makes the drift *detectable*; this job makes it *rare*, by
    # refusing to let shipped code change under a version that already means something else.
    #
    # The opt-out is deliberate and must stay cheap: plenty of skills/** edits are comments or docs. It
    # is a `no-version-bump:` trailer, so opting out is a recorded, greppable decision in the history
    # rather than a silent omission.
    name: skills/** requires a VERSION bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: VERSION bumped, or opted out on the record
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"

          # No `|| true` on any of these. `set -e` must be allowed to kill the job on a git failure:
          # a diff that errors and is swallowed reads as "no skills/** changes" and the gate passes
          # loudest at the exact moment it stopped working. checkout uses fetch-depth: 0, so the base
          # ref is already present and a failure here means something is genuinely wrong.
          changed="$(git diff --name-only "$base"...HEAD -- 'skills/**')"
          if [ -z "$changed" ]; then
            echo "No skills/** changes in this PR — version bump not required."
            exit 0
          fi
          echo "Shipped files changed in this PR:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # An opt-out must be stated in THIS PR's commits, not inherited from history.
          if git log "$base"..HEAD --format='%B' | grep -qiE '^no-version-bump:'; then
            echo "Opted out via a 'no-version-bump:' trailer:"
            git log "$base"..HEAD --format='%B' | grep -iE '^no-version-bump:' | sed 's/^/  /'
            exit 0
          fi

          before="$(git show "$base:VERSION" 2>/dev/null | tr -d '[:space:]' || echo '')"
          after="$(tr -d '[:space:]' < VERSION)"
          # Guard the gate itself: an unreadable base VERSION must FAIL, not silently pass by comparing
          # "" against a real value. A check that green-lights on its own broken input is the DER-2743
          # defect wearing a different hat.
          if [ -z "$before" ]; then
            echo "FAIL: could not read VERSION at $base — refusing to judge a bump I cannot measure." >&2
            exit 1
          fi
          if [ "$before" = "$after" ]; then
            echo "FAIL: this PR changes skills/** but leaves VERSION at $after." >&2
            echo "Two hosts on different code then report the SAME version, and the skew gate reports them as agreeing." >&2
            echo "Either bump VERSION (and add its CHANGELOG section), or add a 'no-version-bump: <why>' trailer to a commit." >&2
            exit 1
          fi
          echo "VERSION bumped $before -> $after"
        shell: bash
